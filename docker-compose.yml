version: '3.8'

services:
  mcp_server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: routewise-mcp-server
    ports:
      - "8000:8000"
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8000
      - MCP_SERVER_PATH=/mcp
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: routewise-backend
    ports:
      - "8001:8001"
    environment:
      - AI_PROVIDER=mock
      - MCP_SERVER_URL=http://mcp_server:8000/mcp
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8001
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    depends_on:
      - mcp_server
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: routewise-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
