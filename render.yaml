services:
  - type: web
    name: routewise-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_production.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: https://*.vercel.app
      - key: MCP_SERVER_URL
        value: http://127.0.0.1:8000/mcp
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: us.anthropic.claude-sonnet-5-5

